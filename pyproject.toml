[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpeek"
dynamic = ["version"]
description = "A tiny, read-only Markdown viewer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PySide6>=6.7", "Pygments>=2.18"]

[project.scripts]
mdpeek = "mdpeek.app:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "Pillow>=10.4,<12"]
release = ["PyInstaller>=6.10,<7", "Pillow>=10.4,<12", "pytest>=8,<9"]

[tool.setuptools.dynamic]
version = {attr = "mdpeek.version.__version__"}

[tool.setuptools.packages.find]
include = ["mdpeek*"]
