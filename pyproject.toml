[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpeek"
version = "0.1.0"
description = "A tiny, read-only Markdown viewer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PySide6>=6.7", "Pygments>=2.18"]

[project.scripts]
mdpeek = "mdpeek.app:main"

[tool.setuptools.packages.find]
include = ["mdpeek*"]
